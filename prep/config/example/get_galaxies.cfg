butler:
  repo: "/repo/dp1"                # Butler repo path
  collections: "LSSTComCam/DP1"    # collection name
  datasetType: "object"            # datasettype to query

query_parameters:
  source_selection_cuts:           # Selection criteria for sources
    i_iPSF_flag: "=False"
    refExtendedness: ">0.5"
  tract:                           # List of tracts to query
    - 4848
    - 4849                         
  quantities:                      # Quantities to retrieve
    - coord_ra
    - coord_dec